<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Label Design Workspace</title>
<style>

:root {
  --ai-bg: #ccfbf1; --ai-border: #14b8a6; --ai-text: #0f766e;
  --human-bg: #dcfce7; --human-border: #22c55e; --human-text: #15803d;
  --neutral-bg: #f1f5f9; --neutral-border: #94a3b8; --neutral-text: #475569;
  --visual-icon: #2563eb; --visual-typo: #7c3aed; --visual-pct: #059669;
  --panel-bg: #ffffff; --app-bg: #f4f5f7; --border: #e2e8f0; --ink: #1e293b; --muted: #64748b;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--app-bg); color: var(--ink); user-select: none; }
header.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: var(--panel-bg); border-bottom: 1px solid var(--border);
}
header.topbar h1 { font-size: 15px; margin: 0; font-weight: 600; }
header.topbar .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.loc-tabs { display: flex; gap: 6px; }
.loc-tabs button {
  padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff;
  cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted);
}
.loc-tabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.banner {
  font-size: 12px; color: #92400e; background: #fffbeb; border-bottom: 1px solid #fde68a;
  padding: 6px 20px;
}
.layout { display: flex; align-items: flex-start; gap: 16px; padding: 16px 20px; }
.sidebar { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.panel-toggle {
  width: 100%; text-align: left; padding: 10px 12px; background: #fff; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
}
.panel-toggle .chev { transition: transform .15s; color: var(--muted); font-size: 11px; }
.panel-toggle.open .chev { transform: rotate(90deg); }
.panel-body { padding: 10px 12px 12px; border-top: 1px solid var(--border); display: none; }
.panel-body.open { display: block; }

.label-cols { display: flex; gap: 8px; }
.label-col { flex: 1; min-width: 0; }
.label-col h5 { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
.label-btn {
  display: block; width: 100%; text-align: left; font-size: 11.5px; padding: 6px 8px; margin-bottom: 5px;
  border-radius: 7px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--ink);
  line-height: 1.25;
}
.label-btn.ai { border-color: var(--ai-border); }
.label-btn.human { border-color: var(--human-border); }
.label-btn.ai.selected { background: var(--ai-bg); color: var(--ai-text); border-color: var(--ai-border); font-weight: 600; }
.label-btn.human.selected { background: var(--human-bg); color: var(--human-text); border-color: var(--human-border); font-weight: 600; }
.label-btn:disabled { opacity: .35; cursor: not-allowed; }
.noai-row { margin-top: 8px; }
.label-btn.noai { border-color: var(--neutral-border); }
.label-btn.noai.selected { background: var(--neutral-bg); color: var(--neutral-text); font-weight: 600; }

.visual-style-row { margin-bottom: 8px; }
.visual-toggle {
  width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink);
}
.visual-toggle .dot { width: 9px; height: 9px; border-radius: 50%; }
.visual-toggle.selected { background: #f8fafc; }
.variant-strip { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 2px 4px; }
.variant-chip {
  font-size: 11px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); background: #fff;
  cursor: pointer; color: var(--muted);
}
.variant-chip.selected { color: #fff; border-color: transparent; }

.hint { font-size: 11px; color: #b45309; margin-top: 6px; min-height: 14px; }

.tray-panel { padding: 10px 12px; }
.tray-panel h5 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; letter-spacing: .04em;}
.build-preview { min-height: 34px; display: flex; align-items: center; margin-bottom: 8px; }
.add-btn {
  width: 100%; padding: 8px; border-radius: 8px; border: none; background: var(--ink); color: #fff;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.add-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
.tray-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tray-item { position: relative; cursor: grab; }
.tray-item .chip-remove { display:none; }
.tray-item:hover .chip-remove { display: flex; }
.clear-btn { font-size: 11px; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; margin-top: 8px; }

.canvas-wrap { flex: 1; min-width: 0; }
.mock {
  position: relative; background: #fff; border: 1px solid var(--border); border-radius: 10px;
  min-height: 560px; overflow: hidden; user-select: none;
}

/* chip */
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.08);
  border: 1.5px solid transparent;
}
.chip-text.ai { background: var(--ai-bg); color: var(--ai-text); border-color: var(--ai-border); }
.chip-text.human { background: var(--human-bg); color: var(--human-text); border-color: var(--human-border); }
.chip-text.noai { background: var(--neutral-bg); color: var(--neutral-text); border-color: var(--neutral-border); }
.chip-plus { opacity: .5; font-weight: 400; }
.chip-icon-glyph {
  display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px;
  border-radius: 50%; background: #eff6ff; color: var(--visual-icon); font-size: 11px;
}
.chip-typo-sample { font-weight: 700; color: var(--visual-typo); }
.chip-typo-sample.font { font-style: italic; font-family: Georgia, serif; }
.chip-typo-sample.highlight { background: #ede9fe; padding: 1px 5px; border-radius: 4px; }
.chip-pct { display:inline-flex; align-items:center; gap:5px; color: var(--visual-pct); cursor: pointer;}
.chip-pct .bar-track { width: 42px; height: 6px; border-radius: 4px; background: #d1fae5; overflow: hidden; }
.chip-pct .bar-fill { height: 100%; background: var(--visual-pct); }

.placed-chip { position: absolute; touch-action: none; }
.chip-remove {
  width: 15px; height: 15px; border-radius: 50%; background: #ef4444; color: #fff; border: none;
  font-size: 10px; line-height: 15px; text-align: center; cursor: pointer; margin-left: 2px; padding: 0;
}
.ghost-chip { position: fixed; pointer-events: none; z-index: 999; opacity: .9; transform: translate(-50%, -50%); }

/* --- repo mock --- */
.mock-repo-header { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.mock-breadcrumb { font-size: 14px; color: var(--muted); }
.mock-breadcrumb b { color: var(--ink); }
.mock-tabs { margin-top: 8px; display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
.mock-badgerow { min-height: 34px; padding: 6px 16px; border-bottom: 1px dashed var(--border); display: flex; gap: 6px; align-items: center; flex-wrap: wrap;}
.mock-badgerow::before { content: 'badge row'; font-size: 10px; color: #cbd5e1; position: absolute; margin-top: -2px; }
.mock-repo-body { display: flex; gap: 0; }
.mock-filelist { flex: 1; padding: 10px 16px; border-right: 1px solid var(--border); }
.mock-file-row { font-size: 12.5px; padding: 7px 4px; color: var(--ink); border-bottom: 1px solid #f1f5f9; }
.mock-sidebar { width: 220px; padding: 12px 16px; }
.mock-sidebar h4 { font-size: 13px; margin: 0 0 6px; }
.mock-sidebar .muted { font-size: 11.5px; color: var(--muted); }
.mock-topics { margin-top: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
.mock-topics span { font-size: 10.5px; background: #eff6ff; color: #1d4ed8; padding: 2px 8px; border-radius: 999px; }

/* --- folder mock --- */
.mock-folder { display: flex; }
.mock-folder-sidebar { width: 230px; border-right: 1px solid var(--border); padding: 10px 0; }
.tree-item { font-size: 12.5px; padding: 5px 14px; color: var(--ink); }
.tree-item.indent { padding-left: 30px; }
.tree-item.indent2 { padding-left: 46px; color: var(--muted); }
.mock-folder-main { flex: 1; padding: 16px; }
.mock-folder-main h4 { margin: 0 0 6px; font-size: 14px; }
.mock-folder-main .muted { font-size: 12px; color: var(--muted); }

/* --- file mock --- */
.mock-file-tab { padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--muted); background: #f8fafc; }
.mock-code { padding: 6px 0; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.code-line { display: flex; padding: 3px 16px; border-radius: 4px; position: relative; }
.code-line:hover { background: #f8fafc; }
.code-line .ln { width: 26px; color: #cbd5e1; user-select: none; flex-shrink: 0; }
.code-line .code { white-space: pre; color: #334155; }
.code-line .line-tag { position: absolute; right: 14px; top: 2px; font-size: 9.5px; padding: 1px 6px; border-radius: 999px; }

</style>
</head>
<body>

<header class="topbar">
  <div>
    <h1>AI Label Design Workspace</h1>
    <div class="sub">Build a label, drag it onto a location mockup, see how it reads.</div>
  </div>
  <div class="loc-tabs" id="locTabs"></div>
</header>
<div class="banner">Location mockups are placeholders based on typical file / folder / GitHub layouts — share your Figma "location" frames and I'll match them exactly.</div>

<div class="layout">
  <div class="sidebar">

    <div class="panel">
      <button class="panel-toggle" id="labelsToggle">🏷️ Labels <span class="chev">▸</span></button>
      <div class="panel-body" id="labelsBody"></div>
    </div>

    <div class="panel">
      <button class="panel-toggle" id="visualToggle">🎨 Visual <span class="chev">▸</span></button>
      <div class="panel-body" id="visualBody"></div>
    </div>

    <div class="panel tray-panel">
      <h5>Build a chip</h5>
      <div class="build-preview" id="buildPreview"><span style="font-size:12px;color:var(--muted)">Pick label(s) and/or a visual style above</span></div>
      <div class="hint" id="buildHint"></div>
      <button class="add-btn" id="addBtn" disabled>Add to tray</button>
      <div class="tray-list" id="trayList"></div>
    </div>

  </div>

  <div class="canvas-wrap">
    <div id="canvasHost"></div>
    <button class="clear-btn" id="clearBtn">Clear this board</button>
  </div>
</div>

<script>
const T_LABELS = [

  },

const VISUAL_STYLES = [
  { id: 'icon', text: 'Icon', color: '#2563eb', variants: [
    { id: 'emoji', text: 'Emoji', glyph: '🙂' },
    { id: 'logo', text: 'Logo mark', glyph: '◆' },
    { id: 'sticker', text: 'Sticker', glyph: '⬤' },
    { id: 'symbol', text: 'Distinct symbol', glyph: '△' },
    { id: 'combined', text: 'Combined (half human / half AI)', glyph: '◐' },
  ]},
  { id: 'typography', text: 'Typography', color: '#7c3aed', variants: [
    { id: 'color', text: 'Color' },
    { id: 'font', text: 'Font' },
    { id: 'highlight', text: 'Highlight style' },
  ]},
  { id: 'percentage', text: 'Percentage / AI score', color: '#059669', variants: [
    { id: 'simple', text: 'Simple % badge' },
    { id: 'bar', text: 'Score bar' },
    { id: 'split', text: 'Contribution split (Human—AI)' },
  ]},
];

const TT_PAIRS = [["human-led", "ai-assisted"], ["human-supervised", "ai-assisted"], ["human-developed", "ai-assisted"], ["human-led", "ai-generated"], ["human-supervised", "ai-generated"], ["human-assisted", "ai-generated"], ["human-reviewed", "ai-generated"], ["human-supported", "ai-generated"], ["cross-checked-by-human", "ai-generated"], ["with-without-human-intervention", "ai-generated"], ["human-optimized", "ai-generated"], ["human-assisted", "ai-led"], ["human-reviewed", "ai-led"], ["human-supported", "ai-led"], ["cross-checked-by-human", "ai-led"], ["with-without-human-intervention", "ai-led"], ["human-developed", "ai-led"], ["human-optimized", "ai-led"], ["human-led", "authored-by-ai"], ["human-supervised", "authored-by-ai"], ["human-assisted", "authored-by-ai"], ["human-reviewed", "authored-by-ai"], ["human-supported", "authored-by-ai"], ["cross-checked-by-human", "authored-by-ai"], ["with-without-human-intervention", "authored-by-ai"], ["human-optimized", "authored-by-ai"], ["human-ai-name", "authored-by-ai"], ["human-led", "vibe-coded"], ["human-supervised", "vibe-coded"], ["human-assisted", "vibe-coded"], ["human-reviewed", "vibe-coded"], ["human-supported", "vibe-coded"], ["cross-checked-by-human", "vibe-coded"], ["with-without-human-intervention", "vibe-coded"], ["human-optimized", "vibe-coded"], ["human-led", "ai-developed"], ["human-supervised", "ai-developed"], ["human-assisted", "ai-developed"], ["human-reviewed", "ai-developed"], ["human-supported", "ai-developed"], ["cross-checked-by-human", "ai-developed"], ["with-without-human-intervention", "ai-developed"], ["human-optimized", "ai-developed"], ["human-led", "ai-made-x"], ["human-supervised", "ai-made-x"], ["human-assisted", "ai-made-x"], ["human-reviewed", "ai-made-x"], ["human-supported", "ai-made-x"], ["cross-checked-by-human", "ai-made-x"], ["with-without-human-intervention", "ai-made-x"], ["human-developed", "ai-made-x"], ["human-optimized", "ai-made-x"], ["human-led", "brainstormed-with-ai"], ["human-supervised", "brainstormed-with-ai"], ["human-developed", "brainstormed-with-ai"], ["human-optimized", "brainstormed-with-ai"], ["human-led", "co-authored-by-ai"], ["human-supervised", "co-authored-by-ai"], ["human-led", "ai-used"], ["human-supervised", "ai-used"], ["human-assisted", "ai-used"], ["human-reviewed", "ai-used"], ["human-supported", "ai-used"], ["cross-checked-by-human", "ai-used"], ["with-without-human-intervention", "ai-used"], ["human-developed", "ai-used"], ["human-ai-name", "ai-used"], ["human-led", "partial-ai-use"], ["human-supervised", "partial-ai-use"], ["human-assisted", "partial-ai-use"], ["human-reviewed", "partial-ai-use"], ["human-supported", "partial-ai-use"], ["cross-checked-by-human", "partial-ai-use"], ["with-without-human-intervention", "partial-ai-use"], ["human-developed", "partial-ai-use"], ["human-ai-name", "partial-ai-use"], ["human-led", "complete-ai-use"], ["human-supervised", "complete-ai-use"], ["human-reviewed", "complete-ai-use"], ["human-supported", "complete-ai-use"], ["cross-checked-by-human", "complete-ai-use"], ["with-without-human-intervention", "complete-ai-use"], ["human-developed", "complete-ai-use"], ["human-ai-name", "complete-ai-use"], ["human-developed", "no-ai"]];
const TV_PAIRS = [["ai-assisted", "icon"], ["ai-assisted", "typography"], ["ai-assisted", "percentage"], ["ai-generated", "icon"], ["ai-generated", "typography"], ["ai-generated", "percentage"], ["ai-led", "icon"], ["ai-led", "typography"], ["ai-led", "percentage"], ["authored-by-ai", "icon"], ["authored-by-ai", "typography"], ["authored-by-ai", "percentage"], ["vibe-coded", "icon"], ["vibe-coded", "typography"], ["vibe-coded", "percentage"], ["ai-developed", "icon"], ["ai-developed", "typography"], ["ai-developed", "percentage"], ["ai-made-x", "icon"], ["ai-made-x", "typography"], ["ai-made-x", "percentage"], ["brainstormed-with-ai", "icon"], ["brainstormed-with-ai", "typography"], ["brainstormed-with-ai", "percentage"], ["co-authored-by-ai", "icon"], ["co-authored-by-ai", "typography"], ["co-authored-by-ai", "percentage"], ["verified-by-ai", "icon"], ["verified-by-ai", "typography"], ["verified-by-ai", "percentage"], ["ai-used", "icon"], ["ai-used", "typography"], ["ai-used", "percentage"], ["partial-ai-use", "icon"], ["partial-ai-use", "typography"], ["partial-ai-use", "percentage"], ["complete-ai-use", "icon"], ["complete-ai-use", "typography"], ["complete-ai-use", "percentage"], ["no-ai", "percentage"], ["human-led", "icon"], ["human-led", "typography"], ["human-led", "percentage"], ["human-supervised", "icon"], ["human-supervised", "typography"], ["human-supervised", "percentage"], ["human-assisted", "icon"], ["human-assisted", "typography"], ["human-assisted", "percentage"], ["human-reviewed", "icon"], ["human-reviewed", "typography"], ["human-reviewed", "percentage"], ["human-supported", "icon"], ["human-supported", "typography"], ["human-supported", "percentage"], ["cross-checked-by-human", "icon"], ["cross-checked-by-human", "typography"], ["cross-checked-by-human", "percentage"], ["with-without-human-intervention", "icon"], ["with-without-human-intervention", "typography"], ["with-without-human-intervention", "percentage"], ["human-developed", "icon"], ["human-developed", "typography"], ["human-developed", "percentage"], ["human-optimized", "icon"], ["human-optimized", "typography"], ["human-optimized", "percentage"], ["human-ai-name", "icon"], ["human-ai-name", "typography"], ["human-ai-name", "percentage"]];
const VV_PAIRS = [["icon", "typography"], ["icon", "percentage"], ["typography", "percentage"]];
// ---------- lookups ----------
const labelById = Object.fromEntries(T_LABELS.map(l => [l.id, l]));
const styleById = Object.fromEntries(VISUAL_STYLES.map(s => [s.id, s]));
function variantOf(styleId, variantId) {
  return styleById[styleId].variants.find(v => v.id === variantId);
}
function pairIn(pairs, a, b) {
  return pairs.some(p => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a));
}

const LOCATIONS = [
  { id: 'repo', label: 'Repository (GitHub)' },
  { id: 'folder', label: 'Folder / Project' },
  { id: 'file', label: 'File' },
];

const FILE_LINES = [
  "function calculateTotal(items) {",
  "  let total = 0;",
  "  for (const item of items) {",
  "    total += item.price * item.qty;",
  "  }",
  "  return total;",
  "}",
  "",
  "export function formatCurrency(value) {",
  "  return `$${value.toFixed(2)}`;",
  "}",
];

// ---------- state ----------
let selectedText = [];   // up to 2 label ids
let selectedVisual = []; // up to 2 {style, variant}
let activeLocation = 'repo';
let chipsByLocation = { repo: [], folder: [], file: [] };
let fileLineAnnotations = {}; // lineIndex -> {config}
let chipSeq = 1;

// ---------- validation of current build selection ----------
function currentComboState() {
  const nText = selectedText.length;
  const nVisual = selectedVisual.length;
  if (nText === 0 && nVisual === 0) return { valid: false, hint: '' };
  if (nText >= 1 && nVisual >= 1 && !(nText === 1 && nVisual === 1)) {
    return { valid: false, hint: "Triple combos aren't enabled yet — pick either two labels, two visual styles, or exactly one of each." };
  }
  if (nText === 2) {
    const ok = pairIn(TT_PAIRS, selectedText[0], selectedText[1]);
    if (!ok) return { valid: false, hint: 'That pairing is not in the vetted T+T list yet.' };
  }
  if (nVisual === 2) {
    const ok = pairIn(VV_PAIRS, selectedVisual[0].style, selectedVisual[1].style);
    if (!ok) return { valid: false, hint: 'That visual pairing is not in the vetted V+V list yet.' };
  }
  if (nText === 1 && nVisual === 1) {
    const ok = pairIn(TV_PAIRS, selectedText[0], selectedVisual[0].style);
    if (!ok) {
      const label = labelById[selectedText[0]].text;
      const okStyles = TV_PAIRS.filter(p => p[0] === selectedText[0]).map(p => styleById[p[1]].text);
      return { valid: false, hint: `"${label}" only pairs with: ${okStyles.join(', ') || 'nothing yet'}.` };
    }
  }
  return { valid: true, hint: '' };
}

function buildConfig() {
  return {
    text: selectedText.slice(),
    visual: selectedVisual.map(v => ({ style: v.style, variant: v.variant })),
  };
}

// ---------- chip rendering ----------
function chipTextPartHTML(id) {
  const l = labelById[id];
  const cls = l.part === 'ai' ? 'ai' : (l.part === 'human' ? 'human' : 'noai');
  return `<span class="chip-text ${cls}">${l.text}</span>`;
}

function chipVisualPartHTML(v) {
  const style = styleById[v.style];
  const variant = variantOf(v.style, v.variant) || style.variants[0];
  if (v.style === 'icon') {
    return `<span class="chip-icon-glyph" title="${variant.text}">${variant.glyph}</span>`;
  }
  if (v.style === 'typography') {
    const cls = variant.id === 'font' ? 'font' : (variant.id === 'highlight' ? 'highlight' : '');
    return `<span class="chip-typo-sample ${cls}" title="${variant.text}">Aa</span>`;
  }
  // percentage
  const pctVariant = variant.id;
  const startPct = 70;
  if (pctVariant === 'bar') {
    return `<span class="chip-pct" data-pctvariant="bar" data-pct="${startPct}">
      <span class="bar-track"><span class="bar-fill" style="width:${startPct}%"></span></span>
    </span>`;
  }
  if (pctVariant === 'split') {
    return `<span class="chip-pct" data-pctvariant="split" data-pct="${startPct}"><span class="pct-label">Human ${100-startPct}% · AI ${startPct}%</span></span>`;
  }
  return `<span class="chip-pct" data-pctvariant="simple" data-pct="${startPct}"><span class="pct-label">${startPct}%</span></span>`;
}

function chipInnerHTML(config) {
  const parts = [];
  config.text.forEach((id, i) => {
    if (i > 0) parts.push('<span class="chip-plus">+</span>');
    parts.push(chipTextPartHTML(id));
  });
  if (config.text.length && config.visual.length) parts.push('<span class="chip-plus">·</span>');
  config.visual.forEach((v, i) => {
    if (i > 0) parts.push('<span class="chip-plus">+</span>');
    parts.push(chipVisualPartHTML(v));
  });
  return parts.join('');
}

function chipHTML(config, extraClass) {
  return `<span class="chip ${extraClass || ''}">${chipInnerHTML(config)}</span>`;
}

// clicking a percentage badge cycles its displayed value
document.addEventListener('click', (e) => {
  const pct = e.target.closest('.chip-pct');
  if (!pct) return;
  const cur = parseInt(pct.dataset.pct, 10);
  const cycle = [30, 50, 70, 90];
  const next = cycle[(cycle.indexOf(cur) + 1) % cycle.length];
  pct.dataset.pct = next;
  const variant = pct.dataset.pctvariant;
  if (variant === 'bar') {
    pct.querySelector('.bar-fill').style.width = next + '%';
  } else if (variant === 'split') {
    pct.querySelector('.pct-label').textContent = `Human ${100-next}% · AI ${next}%`;
  } else {
    pct.querySelector('.pct-label').textContent = next + '%';
  }
});

// ---------- Labels panel ----------
function renderLabelsPanel() {
  const body = document.getElementById('labelsBody');
  const ai = T_LABELS.filter(l => l.part === 'ai');
  const human = T_LABELS.filter(l => l.part === 'human');
  const noai = T_LABELS.find(l => l.part === null);

  function canPick(id) {
    if (selectedText.includes(id)) return true;
    if (selectedText.length >= 2) return false;
    if (selectedText.length === 1) return pairIn(TT_PAIRS, selectedText[0], id);
    return true;
  }

  function col(list, cls, title) {
    return `<div class="label-col"><h5>${title}</h5>` + list.map(l => {
      const sel = selectedText.includes(l.id);
      const enabled = canPick(l.id);
      return `<button class="label-btn ${cls} ${sel ? 'selected' : ''}" data-id="${l.id}" ${enabled ? '' : 'disabled'}>${l.text}</button>`;
    }).join('') + `</div>`;
  }

  body.innerHTML = `
    <div class="label-cols">
      ${col(ai, 'ai', 'AI part')}
      ${col(human, 'human', 'Human part')}
    </div>
    <div class="noai-row">
      <button class="label-btn noai ${selectedText.includes(noai.id) ? 'selected' : ''}" data-id="${noai.id}" ${canPick(noai.id) ? '' : 'disabled'}>${noai.text}</button>
    </div>
  `;

  body.querySelectorAll('.label-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (selectedText.includes(id)) {
        selectedText = selectedText.filter(x => x !== id);
      } else if (selectedText.length < 2 && canPick(id)) {
        selectedText.push(id);
      }
      renderLabelsPanel();
      updateBuildPreview();
    });
  });
}

// ---------- Visual panel ----------
function renderVisualPanel() {
  const body = document.getElementById('visualBody');
  function canPickStyle(styleId) {
    if (selectedVisual.some(v => v.style === styleId)) return true;
    if (selectedVisual.length >= 2) return false;
    if (selectedVisual.length === 1) return pairIn(VV_PAIRS, selectedVisual[0].style, styleId);
    return true;
  }
  body.innerHTML = VISUAL_STYLES.map(style => {
    const sel = selectedVisual.find(v => v.style === style.id);
    const enabled = canPickStyle(style.id);
    let variantsHTML = '';
    if (sel) {
      variantsHTML = `<div class="variant-strip">` + style.variants.map(v => `
        <span class="variant-chip ${sel.variant === v.id ? 'selected' : ''}" data-style="${style.id}" data-variant="${v.id}"
          style="${sel.variant === v.id ? 'background:' + style.color + ';' : ''}">${v.text}</span>
      `).join('') + `</div>`;
    }
    return `
      <div class="visual-style-row">
        <button class="visual-toggle ${sel ? 'selected' : ''}" data-style="${style.id}" ${enabled ? '' : 'disabled'}>
          <span class="dot" style="background:${style.color}"></span>${style.text}
        </button>
        ${variantsHTML}
      </div>`;
  }).join('');

  body.querySelectorAll('.visual-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const styleId = btn.dataset.style;
      const existing = selectedVisual.find(v => v.style === styleId);
      if (existing) {
        selectedVisual = selectedVisual.filter(v => v.style !== styleId);
      } else if (selectedVisual.length < 2) {
        selectedVisual.push({ style: styleId, variant: styleById[styleId].variants[0].id });
      }
      renderVisualPanel();
      updateBuildPreview();
    });
  });

  body.querySelectorAll('.variant-chip').forEach(chip => {
    chip.addEventListener('click', (e) => {
      e.stopPropagation();
      const styleId = chip.dataset.style;
      const variantId = chip.dataset.variant;
      const entry = selectedVisual.find(v => v.style === styleId);
      if (entry) entry.variant = variantId;
      renderVisualPanel();
      updateBuildPreview();
    });
  });
}

// ---------- build / tray ----------
function updateBuildPreview() {
  const preview = document.getElementById('buildPreview');
  const hintEl = document.getElementById('buildHint');
  const addBtn = document.getElementById('addBtn');
  const state = currentComboState();
  if (selectedText.length === 0 && selectedVisual.length === 0) {
    preview.innerHTML = `<span style="font-size:12px;color:var(--muted)">Pick label(s) and/or a visual style above</span>`;
  } else {
    preview.innerHTML = chipHTML(buildConfig());
  }
  hintEl.textContent = state.hint;
  addBtn.disabled = !state.valid;
}

function renderTray() {
  const trayList = document.getElementById('trayList');
  trayList.innerHTML = window.__tray.map(item => `
    <span class="tray-item" data-tray-id="${item.id}">
      ${chipHTML(item.config)}
      <button class="chip-remove" data-remove-tray="${item.id}" title="Remove from tray">✕</button>
    </span>
  `).join('');

  trayList.querySelectorAll('[data-remove-tray]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.removeTray;
      window.__tray = window.__tray.filter(t => t.id !== id);
      renderTray();
    });
  });

  trayList.querySelectorAll('.tray-item').forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.chip-remove')) return;
      const id = el.dataset.trayId;
      const item = window.__tray.find(t => t.id === id);
      startStampDrag(item.config, e);
    });
  });
}
window.__tray = [];

document.getElementById('addBtn').addEventListener('click', () => {
  const state = currentComboState();
  if (!state.valid) return;
  window.__tray.push({ id: 'tray-' + (chipSeq++), config: buildConfig() });
  selectedText = [];
  selectedVisual = [];
  renderLabelsPanel();
  renderVisualPanel();
  updateBuildPreview();
  renderTray();
});

// ---------- drag to place ----------
// Chips whose whole surface is a percentage badge are also click-to-cycle targets,
// so dragging only "arms" once the pointer has actually moved past a small threshold —
// a plain click (no movement) falls through to the delegated .chip-pct click handler instead.
const DRAG_THRESHOLD = 4;
let ghostEl = null;
function startStampDrag(config, downEvent) {
  const startX = downEvent.clientX, startY = downEvent.clientY;
  let dragging = false;

  function onMove(e) {
    if (!dragging) {
      if (Math.abs(e.clientX - startX) < DRAG_THRESHOLD && Math.abs(e.clientY - startY) < DRAG_THRESHOLD) return;
      dragging = true;
      ghostEl = document.createElement('div');
      ghostEl.className = 'ghost-chip';
      ghostEl.innerHTML = chipHTML(config);
      document.body.appendChild(ghostEl);
    }
    e.preventDefault();
    moveGhost(e.clientX, e.clientY);
  }
  function onUp(e) {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if (!dragging) return;
    dropChip(config, e.clientX, e.clientY);
    if (ghostEl) { ghostEl.remove(); ghostEl = null; }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}
function moveGhost(x, y) {
  if (!ghostEl) return;
  ghostEl.style.left = x + 'px';
  ghostEl.style.top = y + 'px';
}

function dropChip(config, clientX, clientY) {
  const mock = document.getElementById('mockActive');
  if (!mock) return;
  const rect = mock.getBoundingClientRect();
  if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return;

  if (activeLocation === 'file' && config.visual.some(v => v.style === 'typography')) {
    const under = document.elementFromPoint(clientX, clientY);
    const lineEl = under && under.closest ? under.closest('.code-line') : null;
    if (lineEl) {
      const idx = parseInt(lineEl.dataset.line, 10);
      fileLineAnnotations[idx] = { config };
      renderCanvas();
      return;
    }
  }

  const x = Math.max(4, Math.min(rect.width - 160, clientX - rect.left - 20));
  const y = Math.max(4, Math.min(rect.height - 40, clientY - rect.top - 14));
  const chip = { id: 'c' + (chipSeq++), config, x, y };
  chipsByLocation[activeLocation].push(chip);
  renderCanvas();
}

function enableReposition(el, chip) {
  el.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.chip-remove')) return;
    const mock = document.getElementById('mockActive');
    const rect = mock.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    let dragging = false;
    function onMove(ev) {
      if (!dragging) {
        if (Math.abs(ev.clientX - startX) < DRAG_THRESHOLD && Math.abs(ev.clientY - startY) < DRAG_THRESHOLD) return;
        dragging = true;
      }
      ev.preventDefault();
      const x = Math.max(0, Math.min(rect.width - 30, ev.clientX - rect.left - 20));
      const y = Math.max(0, Math.min(rect.height - 20, ev.clientY - rect.top - 14));
      chip.x = x; chip.y = y;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

// ---------- canvases ----------
function mockRepoHTML() {
  return `
    <div class="mock-repo-header">
      <div class="mock-breadcrumb">📁 your-org / <b>your-repo</b></div>
      <div class="mock-tabs"><span>Code</span><span>Issues</span><span>Pull requests</span><span>Actions</span></div>
    </div>
    <div class="mock-badgerow" style="padding-top:16px;"></div>
    <div class="mock-repo-body">
      <div class="mock-filelist">
        <div class="mock-file-row">📄 README.md</div>
        <div class="mock-file-row">📁 src/</div>
        <div class="mock-file-row">📁 tests/</div>
        <div class="mock-file-row">📄 package.json</div>
        <div class="mock-file-row">📄 index.js</div>
      </div>
      <div class="mock-sidebar">
        <h4>About</h4>
        <p class="muted">Short project description goes here.</p>
        <div class="mock-topics"><span>topic-a</span><span>topic-b</span></div>
      </div>
    </div>`;
}
function mockFolderHTML() {
  return `
    <div class="mock-folder-sidebar">
      <div class="tree-item">📁 project-root</div>
      <div class="tree-item indent">📁 src</div>
      <div class="tree-item indent2">📄 app.js</div>
      <div class="tree-item indent2">📄 utils.js</div>
      <div class="tree-item indent">📁 tests</div>
      <div class="tree-item indent">📄 package.json</div>
      <div class="tree-item indent">📄 README.md</div>
    </div>
    <div class="mock-folder-main">
      <h4>project-root</h4>
      <p class="muted">Project overview / dashboard placeholder.</p>
    </div>`;
}
function mockFileHTML() {
  const lines = FILE_LINES.map((code, i) => `
    <div class="code-line" data-line="${i}">
      <span class="ln">${i + 1}</span><span class="code">${escapeHTML(code)}</span>
    </div>`).join('');
  return `
    <div class="mock-file-tab">📄 app.js</div>
    <div class="mock-code">${lines}</div>`;
}
function escapeHTML(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderCanvas() {
  const host = document.getElementById('canvasHost');
  let inner = '';
  if (activeLocation === 'repo') inner = mockRepoHTML();
  else if (activeLocation === 'folder') inner = mockFolderHTML();
  else inner = mockFileHTML();

  host.innerHTML = `<div class="mock mock-${activeLocation}" id="mockActive">${inner}</div>`;
  const mock = document.getElementById('mockActive');

  chipsByLocation[activeLocation].forEach(chip => {
    const el = document.createElement('div');
    el.className = 'placed-chip';
    el.style.left = chip.x + 'px';
    el.style.top = chip.y + 'px';
    el.innerHTML = chipHTML(chip.config) + `<button class="chip-remove" data-remove-chip="${chip.id}">✕</button>`;
    mock.appendChild(el);
    enableReposition(el, chip);
    el.querySelector('[data-remove-chip]').addEventListener('click', (e) => {
      e.stopPropagation();
      chipsByLocation[activeLocation] = chipsByLocation[activeLocation].filter(c => c.id !== chip.id);
      renderCanvas();
    });
  });

  if (activeLocation === 'file') {
    Object.entries(fileLineAnnotations).forEach(([idx, ann]) => {
      const lineEl = mock.querySelector(`.code-line[data-line="${idx}"]`);
      if (!lineEl) return;
      const typo = ann.config.visual.find(v => v.style === 'typography');
      const variant = typo ? variantOf('typography', typo.variant) : null;
      const codeSpan = lineEl.querySelector('.code');
      if (variant && variant.id === 'color') { codeSpan.style.color = '#7c3aed'; codeSpan.style.fontWeight = '600'; }
      else if (variant && variant.id === 'font') { codeSpan.style.fontStyle = 'italic'; codeSpan.style.color = '#7c3aed'; }
      else if (variant && variant.id === 'highlight') { codeSpan.style.background = '#ede9fe'; codeSpan.style.borderRadius = '4px'; codeSpan.style.padding = '1px 4px'; }

      const label = ann.config.text[0] ? labelById[ann.config.text[0]].text : 'AI';
      const tag = document.createElement('span');
      tag.className = 'line-tag';
      tag.style.background = '#ede9fe';
      tag.style.color = '#7c3aed';
      tag.innerHTML = `${label} <span data-remove-line="${idx}" style="cursor:pointer;margin-left:4px;">✕</span>`;
      lineEl.appendChild(tag);
      tag.querySelector('[data-remove-line]').addEventListener('click', (e) => {
        e.stopPropagation();
        delete fileLineAnnotations[idx];
        renderCanvas();
      });
    });
  }
}

document.getElementById('clearBtn').addEventListener('click', () => {
  chipsByLocation[activeLocation] = [];
  if (activeLocation === 'file') fileLineAnnotations = {};
  renderCanvas();
});

// ---------- tabs & panel toggles ----------
function renderTabs() {
  const el = document.getElementById('locTabs');
  el.innerHTML = LOCATIONS.map(l => `<button data-loc="${l.id}" class="${l.id === activeLocation ? 'active' : ''}">${l.label}</button>`).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeLocation = btn.dataset.loc;
      renderTabs();
      renderCanvas();
    });
  });
}

function setupPanelToggle(btnId, bodyId) {
  const btn = document.getElementById(btnId);
  const body = document.getElementById(bodyId);
  btn.addEventListener('click', () => {
    btn.classList.toggle('open');
    body.classList.toggle('open');
  });
}

// ---------- init ----------
renderTabs();
renderLabelsPanel();
renderVisualPanel();
updateBuildPreview();
renderTray();
renderCanvas();
setupPanelToggle('labelsToggle', 'labelsBody');
setupPanelToggle('visualToggle', 'visualBody');
document.getElementById('labelsToggle').click();
document.getElementById('visualToggle').click();

</script>
